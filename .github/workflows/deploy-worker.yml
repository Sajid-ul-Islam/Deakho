name: Deploy Cloudflare Worker Proxy

on:
  push:
    paths:
      - 'deakho-web/worker/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Proxy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'deakho-web'
          command: deploy worker/index.js --name deakho-proxy
